name: Release

# Every push to main that carries a changeset is released, with no PR step:
# version the packages, commit that to main, check, then publish to npm.
# Pushes made with GITHUB_TOKEN never start another workflow run, so the
# version commit can't trigger a second release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Keeps the token: this job pushes the version commit and tags with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Switch to --frozen-lockfile once pnpm-lock.yaml is committed.
      - run: pnpm install --no-frozen-lockfile

      - name: Version packages
        id: version
        run: |
          if [ -z "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            echo "No changesets: nothing to version."
            exit 0
          fi
          # changeset version, then GLASS_VERSION follows the CLI version.
          pnpm version-packages
          version=$(node -p "require('./packages/cli/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version packages ($version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Don't publish a version the checks would reject. (CI runs on the same push, but not on this version commit.)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.version.outputs.version
      - name: Check
        if: steps.version.outputs.version
        run: pnpm build && pnpm typecheck && pnpm test
        env:
          DATAFLARE_REQUIRE_PYTHON: "1"

      - name: Push version commit
        if: steps.version.outputs.version
        # Fails if main moved since checkout; re-run the workflow and it versions on top of the new main.
        run: git push origin HEAD:main

      # Publishes package versions that aren't on npm yet and tags them. A version that is
      # already tagged was published by an earlier run; npm can take a minute to list it,
      # so a push right after a release would otherwise try (and fail) to publish it again.
      - name: Publish
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ -z "$NEW_VERSION" ] && git ls-remote --exit-code --tags origin "refs/tags/dataflare-cli@$version" >/dev/null; then
            echo "$version is already tagged: published by an earlier run."
            exit 0
          fi
          pnpm release
        env:
          # setup-node's registry-url writes an .npmrc that reads NODE_AUTH_TOKEN; without it npm publishes anonymously (E404).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          NEW_VERSION: ${{ steps.version.outputs.version }}

      - name: Push tags and create the GitHub release
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git push origin --tags
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{if(on)exit} on' packages/cli/CHANGELOG.md > notes.md
          gh release create "dataflare-cli@$VERSION" --title "Dataflare $VERSION" --notes-file notes.md --verify-tag || echo "GitHub release not created (tag missing?)"
