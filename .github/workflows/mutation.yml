# Mutation testing (scripts/mutation.ts, StrykerJS). On a pull request it mutates the core,
# worker and cli source files the PR changed, runs each package's tests against every mutant,
# and comments the score and the surviving mutants. Weekly it runs all three packages. It
# informs and never fails: coverage gates PRs in quality.yml, this shows whether the tests
# that run a line would notice if it were wrong.
name: Mutation

on:
  pull_request:
    paths:
      - "packages/core/src/**"
      - "packages/worker/src/**"
      - "packages/cli/src/**"
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Same-repo pull requests only: GitHub gives fork pull requests a read-only token, so those
  # get the job summary and artifact but no comment.
  pull-requests: write

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      # Switch to --frozen-lockfile once pnpm-lock.yaml is committed.
      - run: pnpm install --no-frozen-lockfile

      - name: Run Stryker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pnpm mutation --changed "$BASE_SHA"
          else
            pnpm mutation --all
          fi
          cat coverage/mutation/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: coverage/mutation/
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_MARKER: "<!-- dataflare-mutation-report -->"
        run: .github/scripts/post-quality-comment.sh "$GITHUB_REPOSITORY" "$PR_NUMBER" coverage/mutation/report.md
