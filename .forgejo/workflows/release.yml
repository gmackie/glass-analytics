# Publishes @gmacko/dataflare-cli, -web and -node to the ForgeGraph registry (npm.forgegraf.com)
# from Forgejo (DATFLR-26, DATFLR-27).
#
# The unscoped dataflare-* names on npmjs belong to upstream; this fork never publishes there. Each
# package's publishConfig.registry is npm.forgegraf.com, and the Publish step refuses to run if any
# of them points elsewhere. Versioning is a PR, not a CI push to main:
#
#   1. `pnpm version-packages` on a branch, merged as "Version packages (<version>)".
#   2. This workflow, on that push to main, sees packages/cli at a version that isn't tagged yet:
#      it checks, publishes with `pnpm release` (changeset publish) and pushes the tags.
#
# A push that still carries changesets publishes nothing and says to open the version PR. A
# version that is already tagged was published by an earlier run and is skipped.
#
# Needs the FG_REGISTRY_TOKEN Forgejo secret (`forge registry token create`).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: [forgegraph-ci, forgegraph-worker]
    timeout-minutes: 30
    steps:
      # Keeps the token: this job pushes the release tags with git. Same unpinned checkout as ci.yml,
      # resolved through Forgejo's actions mirror.
      - uses: actions/checkout@v4 # zizmor: ignore[artipacked,unpinned-uses]
        with:
          fetch-depth: 0
      - name: What to release
        id: plan
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          if [ "$pending" != 0 ]; then
            echo "$pending changeset(s) not versioned yet: open a PR with \`pnpm version-packages\` to release them."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/@gmacko/dataflare-cli@$version" >/dev/null; then
            echo "@gmacko/dataflare-cli@$version is already tagged: published by an earlier run."
            exit 0
          fi
          echo "Releasing $version."
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Node and uv from their own distribution points, not the GitHub API (DATFLR-10).
      - name: Toolchain
        if: steps.plan.outputs.version
        run: bash scripts/ci-toolchain.sh
      - name: Install
        if: steps.plan.outputs.version
        run: |
          corepack enable
          pnpm config set store-dir "${RUNNER_TEMP:-/tmp}/pnpm-store"
          pnpm install --frozen-lockfile
      # Don't publish a version the checks would reject.
      - name: Check
        if: steps.plan.outputs.version
        run: pnpm build && pnpm typecheck && pnpm test
        env:
          DATAFLARE_REQUIRE_PYTHON: "1"
      - name: Publish
        if: steps.plan.outputs.version
        env:
          FG_REGISTRY_TOKEN: ${{ secrets.FG_REGISTRY_TOKEN }}
        run: |
          if [ -z "$FG_REGISTRY_TOKEN" ]; then
            echo "The FG_REGISTRY_TOKEN Forgejo secret is not set; nothing was published." >&2
            exit 1
          fi
          for pkg in packages/cli packages/web packages/node; do
            node -e '
              const p = require(`./${process.argv[1]}/package.json`);
              if (!p.name.startsWith("@gmacko/") || p.publishConfig?.registry !== "https://npm.forgegraf.com/") {
                console.error(`${p.name} must be @gmacko/* with publishConfig.registry https://npm.forgegraf.com/`);
                process.exit(1);
              }' "$pkg"
          done
          npmrc="${RUNNER_TEMP:-/tmp}/release.npmrc"
          printf '//npm.forgegraf.com/:_authToken=${FG_REGISTRY_TOKEN}\n@gmacko:registry=https://npm.forgegraf.com/\n' > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" pnpm release
          rm -f "$npmrc"
      - name: Push tags
        if: steps.plan.outputs.version
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git push origin --tags
          git ls-remote --exit-code --tags origin "refs/tags/@gmacko/dataflare-cli@$VERSION"
