packages:
  - apps/expo
  - packages/*
  - site

allowBuilds:
  # pnpm 10 ran no dependency build scripts here; both ship their binaries as optional
  # platform packages, so their postinstall checks are not needed.
  esbuild: false
  workerd: false

minimumReleaseAge: 5760
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600
strictDepBuilds: true
blockExoticSubdeps: true

# Dependencies only @stryker-mutator/core (dev) pulls in, pinned past their advisories:
# minimatch GHSA-g3hv-75wg-m249; qs (via typed-rest-client) GHSA-q8mj-m7cp-5q26,
# GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx, GHSA-6pq8-jhm2-2vcw. Drop each once Stryker
# depends on a patched version.
overrides:
  minimatch@<11.0.1: 11.0.1
  qs@<6.16.1: 6.17.1
